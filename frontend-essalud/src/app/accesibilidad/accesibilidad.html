<div class="acc-widget">
  <button
    type="button"
    class="acc-fab"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuAbierto()"
    aria-label="Opciones de accesibilidad para personas con discapacidad"
    title="Accesibilidad">
    ♿
  </button>

  @if (menuAbierto()) {
    <aside class="acc-panel" aria-label="Herramientas de Accesibilidad">
      <div class="acc-header">
        <span>Accesibilidad (ODS 10)</span>
        <button type="button" class="acc-close" (click)="toggleMenu()" aria-label="Cerrar panel">✕</button>
      </div>

      <div class="acc-body">
        <div class="acc-row">
          <span>Tamaño de texto ({{ accService.tamanoFuente() }}%)</span>
          <div class="acc-btn-group">
            <button type="button" (click)="accService.disminuirTexto()" aria-label="Disminuir tamaño de letra">A-</button>
            <button type="button" (click)="accService.aumentarTexto()" aria-label="Aumentar tamaño de letra">A+</button>
          </div>
        </div>

        <button
          type="button"
          class="acc-option"
          [class.active]="accService.altoContraste()"
          (click)="accService.toggleAltoContraste()">
          🌓 Alto Contraste
        </button>

        <button
          type="button"
          class="acc-option"
          [class.active]="accService.invertirColor()"
          (click)="accService.toggleInvertirColor()">
          🔄 Invertir Colores
        </button>

        <button
          type="button"
          class="acc-option"
          [class.active]="accService.modoDaltonismo()"
          (click)="accService.toggleDaltonismo()">
          👁️ Filtro Daltonismo
        </button>

        <button
          type="button"
          class="acc-option"
          [class.active]="accService.lecturaActiva()"
          (click)="accService.leerPantalla()">
          {{ accService.lecturaActiva() ? '⏹️ Detener Lectura' : '🔊 Leer Texto en Voz Alta' }}
        </button>

        <button type="button" class="acc-reset" (click)="accService.restablecerTodo()">
          Restablecer valores
        </button>
      </div>
    </aside>
  }
</div>

<!-- Filtro SVG oculto para corrección de daltonismo (Protanopía / Deuteranopía) -->
<svg aria-hidden="true" focusable="false" style="display: none; width: 0; height: 0;">
  <filter id="daltonism-filter">
    <feColorMatrix
      type="matrix"
      values="0.567, 0.433, 0,     0, 0
              0.558, 0.442, 0,     0, 0
              0,     0.242, 0.758, 0, 0
              0,     0,     0,     1, 0">
    </feColorMatrix>
  </filter>
</svg>
