<div class="login-wrapper">
  <div class="login-card">
    <h2>EsSalud - Gestión</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="dni">DNI del Personal</label>
        <input id="dni" type="text" formControlName="dni" maxlength="8" placeholder="Ingrese DNI">
      </div>
      <div class="input-group">
        <label for="passwordIn">Contraseña</label>
        <input id="passwordIn" type="password" formControlName="passwordIn" placeholder="••••••••">
      </div>
      <button type="submit" [disabled]="loginForm.invalid">Ingresar al Sistema</button>
    </form>
  </div>
</div>
